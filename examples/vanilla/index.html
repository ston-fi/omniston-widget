<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://static.ston.fi/favicon/favicon.ico"
    />
    <title>Omniston Widget Vanilla example</title>
    <style>
      body {
        min-height: 100vh;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2rem;
      }

      h1 {
        text-align: center;
      }

      #btn-container {
        display: flex;
        width: 100%;
        justify-content: center;
        gap: 8px;
      }

      #btn-create-widget,
      #btn-destroy-widget {
        padding: 0.5rem 1rem;
        border: none;
        cursor: pointer;
      }
    </style>
    <script src="https://widget.ston.fi/v0/index.js"></script>
  </head>
  <body>
    <h1>Ston.fi Omniston Widget</h1>

    <section id="btn-container">
      <button id="btn-create-widget">Create Widget</button>
      <button id="btn-destroy-widget">Destroy Widget</button>
    </section>

    <div id="omniston-widget-container"></div>

    <script type="module">
      const widgetContainer = document.querySelector("#omniston-widget-container");

      const widget = new window.OmnistonWidget({
        tonconnect: {
          type: "standalone",
          options: {
            // see https://docs.ton.org/ecosystem/ton-connect/manifest
            manifestUrl: "https://[myapp.com]/tonconnect-manifest.json",
          },
        },
        widget: {
          defaultBidAsset: "EQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM9c",  // TON
          defaultAskAsset: "EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs",  // USD₮
          customAssets: [
            "EQA2kCVNwVsil2EM2mB0SkXytxCqQjS4mttjDpnXmwG9T6bO",                 // STON
          ],
        },
      });

      widget.on("mount", () => console.log("widget mounted"));
      widget.on("unmount", () => console.log("widget unmounted"));
      widget.on("error", (error) => console.error(error));

      widget.mount(widgetContainer);

      const btnCreate = document.querySelector("#btn-create-widget");

      btnCreate.onclick = () => widget.mount(widgetContainer);

      const btnDestroy = document.querySelector("#btn-destroy-widget");

      btnDestroy.onclick = () => widget.unmount();
    </script>
  </body>
</html>
